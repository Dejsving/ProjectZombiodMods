
image_generation:
  provider: OpenAI
  model_family: GPT Image

  prompt_structure:
    - subject
    - action
    - environment
    - composition
    - camera_angle
    - lens
    - lighting
    - color_palette
    - materials_and_textures
    - art_style
    - atmosphere
    - details
    - constraints

  generation_parameters:
    size:
      - 1024x1024
      - 1024x1536
      - 1536x1024
    quality:
      - low
      - medium
      - high
      - xhigh
      - max
      - auto
    output_format:
      - png
      - webp
      - jpeg
    background:
      - transparent
      - opaque
      - auto

  editing:
    preserve_reference_details: true
    specify_changes_explicitly: true
    preserve_unchanged_elements: true
